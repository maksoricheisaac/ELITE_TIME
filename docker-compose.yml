# ══════════════════════════════════════════════════════════════════════════════
# ELITE TIME — Production (Docker Compose / Dokploy)
#
#   cp .env.example .env   # puis renseigner les secrets (voir docs/environment-variables.md)
#   docker compose up -d --build
#
# Réseaux :
#   data : INTERNE (aucun accès Internet, aucun port publié) — postgres, redis,
#          migrate, backup, api, worker
#   app  : sortant autorisé (LDAP, Microsoft Graph) — web, api, worker
# Aucun port PostgreSQL / Redis / API n'est publié. Le web écoute sur 127.0.0.1
# (WEB_PORT) ; le proxy HTTPS (Traefik de Dokploy) l'atteint via le réseau Docker.
# Les services se joignent par leur nom DNS (postgres, redis, api) — jamais localhost.
# ══════════════════════════════════════════════════════════════════════════════

name: elitetime

x-restart: &restart
  restart: unless-stopped

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

x-app-env: &app-env
  NODE_ENV: production
  TZ: ${TZ:-Africa/Brazzaville}
  DATABASE_URL: postgresql://${POSTGRES_USER:-elitetime}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}@postgres:5432/${POSTGRES_DB:-elitetime}
  REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD requis}@redis:6379
  REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-elitetime:}
  # Clé AES-256-GCM : à REPRENDRE de la production existante, jamais régénérer
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY requis}
  LDAP_URL: ${LDAP_URL:-}
  LDAP_BIND_DN: ${LDAP_BIND_DN:-}
  LDAP_PWD: ${LDAP_PWD:-}
  LDAP_BASE_DN: ${LDAP_BASE_DN:-}
  AZURE_TENANT_ID: ${AZURE_TENANT_ID:-}
  AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:-}
  AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:-}
  GRAPH_SENDER_EMAIL: ${GRAPH_SENDER_EMAIL:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  SMTP_FROM: ${SMTP_FROM:-}

services:
  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    <<: [*restart, *logging]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-elitetime}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}
      POSTGRES_DB: ${POSTGRES_DB:-elitetime}
      TZ: ${TZ:-Africa/Brazzaville}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1g }

  # ── Redis (cache, rate limiting, Socket.IO, BullMQ) ────────────────────────
  # noeviction : BullMQ exige qu'aucune clé de file ne soit évincée.
  # AOF everysec : persistance (files de tâches conservées au redémarrage).
  redis:
    image: redis:7-alpine
    <<: [*restart, *logging]
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD requis}
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - redisdata:/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 384m }

  # ── Migrations Prisma (one-shot, avant api et worker) ──────────────────────
  # Idempotent : "migrate deploy" ; base vide => amorçage. Jamais de reset.
  migrate:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
      target: migrate
    restart: "no"
    <<: *logging
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-elitetime}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}@postgres:5432/${POSTGRES_DB:-elitetime}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [data]

  # ── API NestJS (non exposée sur Internet) ──────────────────────────────────
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
      target: runtime
    <<: [*restart, *logging]
    environment:
      <<: *app-env
      PORT: "4000"
      HOST: 0.0.0.0
      # Le worker exécute les tâches planifiées : ne PAS les lancer aussi dans l'API
      RUN_SCHEDULERS: "false"
      NEXT_ALLOWED_ORIGINS: https://${APP_DOMAIN:?APP_DOMAIN requis}
      COOKIE_SECURE: "true"
      INTERNAL_SOCKET_TOKEN: ${INTERNAL_SOCKET_TOKEN:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-600}
      THROTTLE_LOGIN_LIMIT: ${THROTTLE_LOGIN_LIMIT:-10}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [data, app]
    stop_grace_period: 30s
    deploy:
      resources:
        limits: { cpus: "1.5", memory: 1g }

  # ── Worker (tâches planifiées BullMQ, e-mails, synchro LDAP) ───────────────
  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.worker
    <<: [*restart, *logging]
    environment:
      <<: *app-env
      WORKER_HEALTH_PORT: "4100"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [data, app]
    stop_grace_period: 60s
    # Chromium (génération PDF) a besoin de /dev/shm suffisant
    shm_size: 512m
    deploy:
      resources:
        limits: { cpus: "1.5", memory: 1536m }

  # ── Frontend Next.js (seul service exposé via le proxy HTTPS) ──────────────
  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
      args:
        # Domaine unique : /api/* (route handlers Next + /api/ai), /socket.io → API via le proxy
        NEXT_PUBLIC_API_URL: https://${APP_DOMAIN:?APP_DOMAIN requis}/api
        NEXT_PUBLIC_SOCKET_URL: ""
        NEXT_ALLOWED_ORIGINS: ${APP_DOMAIN}
    <<: [*restart, *logging]
    environment:
      NODE_ENV: production
      TZ: ${TZ:-Africa/Brazzaville}
      PORT: "3000"
      HOSTNAME: 0.0.0.0
      # Appels serveur Next -> API par le réseau Docker interne
      API_URL: http://api:4000/api
      NEXT_ALLOWED_ORIGINS: ${APP_DOMAIN}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    networks: [app]
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 768m }

  # ── Sauvegarde PostgreSQL quotidienne (pg_dump, rétention en jours) ────────
  backup:
    image: postgres:16-alpine
    <<: [*restart, *logging]
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-elitetime}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-elitetime}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-2}
    volumes:
      - ./infrastructure/postgres/backup.sh:/backup.sh:ro
      - pgbackups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks: [data]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256m }

networks:
  # interne : aucun accès sortant, inaccessible depuis l'extérieur
  data:
    internal: true
  app:

volumes:
  pgdata:
  redisdata:
  pgbackups:
